# Continuous integration for InfraWatch.
# See docs/adr/0016-continuous-integration-and-container-builds.md.
#
# Branch protection on main requires the single "ci-passed" check, which
# succeeds only when every other job has succeeded.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, type-check and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --frozen --all-packages

      - name: Lint (Ruff)
        run: uv run --frozen ruff check --output-format=github .

      - name: Check formatting (Ruff)
        run: uv run --frozen ruff format --check .

      - name: Type-check (mypy, strict, per workspace member)
        run: |
          for member in packages/core apps/api apps/worker apps/agent apps/demo-app; do
            echo "::group::mypy ${member}"
            uv run --frozen mypy "${member}"
            echo "::endgroup::"
          done

      - name: Unit tests with coverage (pytest)
        run: uv run --frozen pytest --cov --cov-report=term --cov-report=xml

      # G9.1: the state machine, permissions, SLA and escalation live in infrawatch_core.
      - name: Coverage floor for the core domain logic
        run: uv run --frozen coverage report --include="*/infrawatch_core/*" --fail-under=95

  web:
    name: Web lint, type-check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies from the lock file
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:coverage

  compose-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure from the example environment only (G0.1)
        run: cp .env.example .env

      - name: Pull and build images
        run: |
          docker compose pull --ignore-buildable
          docker compose build
          # Flush image layers to disk now, so that write-back does not slow the timed start below.
          sync

      - name: Start the stack; every health check must pass within 2 minutes (G0.1, G0.2)
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Seed demo data twice to prove it is idempotent (G0.3)
        run: |
          docker compose exec -T api python -m infrawatch_api.seed
          docker compose exec -T api python -m infrawatch_api.seed

      - name: Check seeded rows (teams | roles | services | team leads | alert rules)
        run: |
          counts=$(docker compose exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U postgres -d infrawatch -tAc "
            SELECT (SELECT count(*) FROM teams), (SELECT count(DISTINCT role) FROM user_roles),
                   (SELECT count(*) FROM services), (SELECT count(*) FROM memberships WHERE is_lead),
                   (SELECT count(*) FROM alert_rules)"')
          echo "Seeded: ${counts}"
          test "${counts}" = "2|8|3|2|3"

      - name: The audit log is insert-only for the app role and the trigger (G8.4, database layer)
        run: bash scripts/check-audit.sh

      - name: Sign-in works, refresh tokens rotate and reuse ends the login (G8.2)
        run: bash scripts/check-auth.sh

      - name: The incident lifecycle and its permissions behave
        run: bash scripts/check-incidents.sh

      - name: Static alert rules fire, create drafts and deduplicate (G2.3, G2.6)
        run: bash scripts/check-alerts.sh

      - name: Email goes out per major event with the on-call in CC (G4.3, G4.4, G4.5, G4.7)
        run: bash scripts/check-notifications.sh

      - name: Telemetry arrives and is served to the web app, faults show within 60 s, nothing lost across an outage (G1.1 to G1.6)
        run: bash scripts/check-telemetry.sh

      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  ci-passed:
    name: ci-passed
    if: always()
    needs: [python, web, compose-smoke, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
