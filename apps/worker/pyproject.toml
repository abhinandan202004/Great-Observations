[project]
name = "infrawatch-worker"
version = "0.1.0"
description = "InfraWatch worker: alert evaluation, anomaly detection, SLA timers, escalation, email dispatch and scheduled jobs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "infrawatch-core",
    "sqlalchemy[asyncio]>=2.0.44",
]

[project.scripts]
infrawatch-worker = "infrawatch_worker.__main__:main"

[tool.uv.sources]
infrawatch-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
