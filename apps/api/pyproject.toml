[project]
name = "infrawatch-api"
version = "0.1.0"
description = "InfraWatch API: authentication, RBAC, ingest, incident workflow, WebSocket gateway and audit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17",
    "asyncpg>=0.30",
    "infrawatch-core",
    "fastapi>=0.120",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
]

[project.scripts]
infrawatch-api = "infrawatch_api.__main__:main"

[tool.uv.sources]
infrawatch-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
